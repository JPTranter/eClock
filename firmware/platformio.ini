; PlatformIO project configuration for eClock
; ---------------------------------------------------------------------------
; THE MOST IMPORTANT LINE IN THIS FILE is board_build.variant. This hardware is
; a XIAO nRF52840 *Plus*, which breaks out nine extra pins (D11..D19) that the
; stock XIAO variant does not define. The EN05 ePaper shield uses two of them
; (DC on D16 = P0.31, RST on D11 = P0.15). Without the Plus variant those
; symbols are either undefined or resolve to entirely different physical pins,
; and the panel never responds - GxEPD2 just reports "Busy Timeout!".
;
; The variant is vendored at firmware/variants/Seeed_XIAO_nRF52840_Plus so a
; clean checkout builds correctly with no external setup.
;
; Two core environments are defined because each trades one problem for another:
;
;   adafruit : display is rock solid. BLE via Bluefruit works on this board too,
;              but see docs/lessons/LESSONS_LEARNT.md - it needs USE_LFRC, since
;              the Plus has no 32 kHz crystal.
;   mbed     : ArduinoBLE without touching the bootloader, but the display needs
;              extra care. Kept buildable to keep the option open.
;
; Board notes for this specific unit (verified 2026-08-22):
;   Bootloader : UF2 0.9.2-29-g6a9a6a3, Board-ID nRF52840-SeeedXiao-v1
;   SoftDevice : S140 7.3.0
;   USB serial : bootloader = VID 0x2886 PID 0x0064 (enumerates as COM6 here)
;                application = VID 0x2886 PID 0x8044 (enumerates as COM11 here)
;
; UPLOAD: use serial DFU, not UF2 drag-and-drop.
;   The UF2 mass-storage drive (XIAO-BOOT) mounted on the first entry to the
;   bootloader but did NOT remount on subsequent resets on this machine, so
;   copying a .uf2 is not repeatable. `pio run -t upload` uses nrfutil serial
;   DFU against the bootloader's CDC port and works every time.
;
;   Full cycle from a running app:
;     python tools/reset_to_bootloader.py     # 1200-baud touch -> bootloader
;     pio run -e adafruit -t upload --upload-port COM6
;
; NOTE ON upload_port: the bootloader and the application enumerate as DIFFERENT
; COM ports with different PIDs. PlatformIO's auto-detect looks for the board
; JSON hwids and can pick the wrong one, so pass --upload-port explicitly with
; the BOOTLOADER port. Do not hardcode upload_port below: it would be wrong for
; monitoring, which needs the application port.

[platformio]
; The current firmware uses ArduinoBLE, so it only compiles on the mbed core
; (main.cpp #error's unless ECLOCK_CORE_MBED is defined). The adafruit env is kept
; only for reference and does not build the shipped main.cpp anymore.
default_envs = mbed
src_dir = src
include_dir = include

[env]
; The _adafruit board variants live in maxgerhardt's fork, not the official
; PlatformIO platform. Pinned by URL so a clean machine resolves identically.
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git
framework = arduino

; --- XIAO nRF52840 Plus variant (see the header comment - do not remove) ---
board_build.variant = Seeed_XIAO_nRF52840_Plus
board_build.variants_dir = variants

; The Plus has no 32 kHz crystal; it must use the internal RC oscillator for the
; low-frequency clock. Leaving USE_LFXO set makes the BLE stack wait forever for
; a crystal that is not fitted.
build_unflags = -D USE_LFXO
build_flags =
    -D USE_LFRC
    -Wall

monitor_speed = 115200
monitor_filters = time, send_on_enter

; Versions pinned so a rebuild years from now resolves identically.
lib_deps =
    zinggjm/GxEPD2@^1.6.9
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.16.2

; Uncomment and set to your board's port if auto-detection fails.
; upload_port = COM6
; monitor_port = COM6

; --- Adafruit nRF52 core (default) -------------------------------------------
[env:adafruit]
board = xiaoble_adafruit
; deep+ mode is required when including Bluefruit52Lib — PlatformIO's default
; dependency finder will not discover it from a bare `#include <bluefruit.h>`
; without traversing deep into the framework's bundled libraries.
lib_ldf_mode = deep+
build_flags =
    ${env.build_flags}
    -DECLOCK_CORE_ADAFRUIT=1

; --- Seeed mbed core ---------------------------------------------------------
[env:mbed]
board = xiaoble
board_build.variant = SEEED_XIAO_NRF52840_SENSE
lib_deps =
    ${env.lib_deps}
    arduino-libraries/ArduinoBLE@^1.3.6
build_flags =
    ${env.build_flags}
    -DECLOCK_CORE_MBED=1

; --- Pin diagnostic ----------------------------------------------------------
; Throwaway harness for probing board wiring. Builds tools/pin_diagnostic/
; instead of src/, with no display library.
;
; CAUTION: this reports on Arduino pin *indices*, which are only meaningful
; relative to the compiled-in variant. Interpreting its output against the wrong
; variant is what sent Phase 2 down a blind alley. Prefer Dxx symbols.
;
; Run with: pio run -e pindiag -t upload --upload-port <bootloader port>
[env:pindiag]
board = xiaoble_adafruit
build_src_filter = -<*> +<../tools/pin_diagnostic/>
lib_deps =
build_flags =
    ${env.build_flags}
    -DECLOCK_CORE_ADAFRUIT=1

; --- Button probe (throwaway dev tool) --------------------------------------
; Confirms the suspected-dead D9 button by reproducing production conditions
; (ePaper SPI init on the shared MISO pin) and counting each button via BOTH
; a GPIO interrupt and a loop poll. NOT part of the shipped firmware.
;
; Run with: pio run -e proto -t upload --upload-port <bootloader port>
;   To enter the bootloader from a running app:
;     python tools/reset_to_bootloader.py
[env:proto]
board = xiaoble
board_build.variant = SEEED_XIAO_NRF52840_SENSE
build_src_filter = -<*> +<../proto/btn_probe/>
build_flags =
    ${env.build_flags}
    -DECLOCK_CORE_MBED=1
lib_deps =
    ${env.lib_deps}
