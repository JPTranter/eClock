; PlatformIO project configuration for eClock
; ---------------------------------------------------------------------------
; Two environments are defined deliberately. The Arduino core for this project
; is NOT yet chosen (see docs/research/RESEARCH_TRACKING.md) because each core
; trades a display problem against a BLE problem:
;
;   adafruit : display works flawlessly (DC=D16, RST=D11), but Bluefruit.begin()
;              hard-faults on the factory Seeed bootloader that this board ships
;              with. BLE requires flashing the Adafruit nRF52 UF2 bootloader.
;   mbed     : ArduinoBLE works without touching the bootloader, but the panel
;              needs DC=15 / RST=11 *and* a low-level TWIM-disable hack, because
;              P0.26/P0.27 are shared with the IMU I2C bus.
;
; Keeping both buildable lets Phase 1 settle the question with measurements
; rather than argument. `adafruit` is the default because the display is the
; higher-risk subsystem and it is rock solid there.
;
; Board notes for this specific unit (verified 2026-08-22):
;   Bootloader : UF2 0.9.2-29-g6a9a6a3, Board-ID nRF52840-SeeedXiao-v1
;   SoftDevice : S140 7.3.0
;   USB serial : bootloader = VID 0x2886 PID 0x0064 (enumerates as COM6 here)
;                application = VID 0x2886 PID 0x8044 (enumerates as COM11 here)
;
; UPLOAD: use serial DFU, not UF2 drag-and-drop.
;   The UF2 mass-storage drive (XIAO-BOOT) mounted on the first entry to the
;   bootloader but did NOT remount on subsequent resets on this machine, so
;   copying a .uf2 is not repeatable. `pio run -t upload` uses nrfutil serial
;   DFU against the bootloader's CDC port and works every time.
;
;   Full cycle from a running app:
;     python tools/reset_to_bootloader.py     # 1200-baud touch -> bootloader
;     pio run -e adafruit -t upload --upload-port COM6
;
; NOTE ON upload_port: the bootloader and the application enumerate as DIFFERENT
; COM ports with different PIDs. PlatformIO's auto-detect looks for the board
; JSON hwids and can pick the wrong one, so pass --upload-port explicitly with
; the BOOTLOADER port. Do not hardcode upload_port below: it would be wrong for
; monitoring, which needs the application port.

[platformio]
default_envs = adafruit
src_dir = src
include_dir = include

[env]
; The _adafruit board variants live in maxgerhardt's fork, not the official
; PlatformIO platform. Pinned by URL so a clean machine resolves identically.
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git
framework = arduino
monitor_speed = 115200
monitor_filters = time, send_on_enter
; Versions pinned so a rebuild years from now resolves identically.
lib_deps =
    zinggjm/GxEPD2@^1.6.9
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.16.2
build_flags =
    -Wall
; Uncomment and set to your board's port if auto-detection fails.
; upload_port = COM6
; monitor_port = COM6

; --- Adafruit nRF52 core -----------------------------------------------------
; Display-first path. Do not enable BLE here without first flashing the
; Adafruit bootloader, or the chip will hard-fault on init.
[env:adafruit]
board = xiaoble_adafruit
build_flags =
    ${env.build_flags}
    -DECLOCK_CORE_ADAFRUIT=1

; --- Seeed mbed core ---------------------------------------------------------
; BLE-first path. Requires the TWIM-disable hack before any display init.
[env:mbed]
board = xiaoble
build_flags =
    ${env.build_flags}
    -DECLOCK_CORE_MBED=1

; --- Pin diagnostic ----------------------------------------------------------
; Throwaway harness that determines the real EN05 wiring empirically. Builds
; tools/pin_diagnostic/ instead of src/, and needs no display library.
; Run with: pio run -e pindiag -t upload --upload-port <bootloader port>
[env:pindiag]
board = xiaoble_adafruit
build_src_filter = -<*> +<../tools/pin_diagnostic/>
lib_deps =
build_flags =
    ${env.build_flags}
    -DECLOCK_CORE_ADAFRUIT=1
