name: Release

# Builds the firmware when a release is published (or a v* tag is pushed) and
# attaches a versioned .hex so it can be downloaded and flashed directly to the
# device with serial DFU (the reliable path documented in docs/SETUP.md).
#
# The release title and body are auto-generated from the git history since the
# previous v* tag (see .github/workflows/gen_release_notes.py), so every release
# ships with a human-readable "what changed" summary.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write            # needed to upload the release asset
  actions: read

jobs:
  firmware:
    name: Build firmware artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # need full history to diff against the previous tag

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: pip install platformio==6.1.19

      - name: Collect version
        id: ver
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Inject version into the firmware
        run: printf '#pragma once\n#ifndef ECLOCK_VERSION\n#define ECLOCK_VERSION "%s"\n#endif\n' "$TAG" > firmware/include/clock_version.h
        env:
          TAG: ${{ steps.ver.outputs.tag }}

      - name: Build mbed firmware
        run: pio run -e mbed
        working-directory: firmware

      - name: Copy artifact to a versioned name + generate UF2
        run: |
          mkdir -p release
          cp firmware/.pio/build/mbed/firmware.hex "release/eClock-${TAG}.hex"
          cp firmware/.pio/build/mbed/firmware.elf "release/eClock-${TAG}.elf"
          python firmware/tools/hex_to_uf2.py "release/eClock-${TAG}.hex" \
            "release/ECLOCK.UF2" --base 0x27000 --family 0xada52840
        env:
          TAG: ${{ steps.ver.outputs.tag }}

      # Summarise the changes since the previous v* tag and derive a title.
      - name: Generate release notes
        id: notes
        run: python .github/workflows/gen_release_notes.py --tag "${GITHUB_REF_NAME}" --out release/NOTES.md

      - name: Attach to release (or create one)
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          files: release/*
          body_file: release/NOTES.md
