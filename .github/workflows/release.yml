name: Release

# Builds the firmware when a release is published (or a v* tag is pushed) and
# attaches a versioned .hex so it can be downloaded and flashed directly to the
# device with serial DFU (the reliable path documented in docs/SETUP.md).
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write            # needed to upload the release asset
  actions: read

jobs:
  firmware:
    name: Build firmware artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO Core
        run: pip install platformio==6.1.19
      - name: Collect version
        id: ver
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Inject version into the firmware
        run: printf '#pragma once\n#ifndef ECLOCK_VERSION\n#define ECLOCK_VERSION "%s"\n#endif\n' "$TAG" > firmware/include/clock_version.h
        env:
          TAG: ${{ steps.ver.outputs.tag }}
      - name: Build mbed firmware
        run: pio run -e mbed
        working-directory: firmware

      - name: Copy artifact to a versioned name + generate UF2
        run: |
          mkdir -p release
          cp firmware/.pio/build/mbed/firmware.hex "release/eClock-${TAG}.hex"
          cp firmware/.pio/build/mbed/firmware.elf "release/eClock-${TAG}.elf"
          # Generate a .uf2 (drag-and-drop onto the XIAO-BOOT mass-storage drive)
          # from the .hex with the repo's self-contained converter. The app runs
          # at 0x27000; nRF52840 family = 0xada52840. (The microsoft/uf2 uf2conv
          # -c path wrote the family ID into the fileSize slot and omitted the
          # magic end, so the .uf2 did not flash; hex_to_uf2.py writes the header
          # correctly.)
          python firmware/tools/hex_to_uf2.py "release/eClock-${TAG}.hex" \
            "release/eClock-${TAG}.uf2" --base 0x27000 --family 0xada52840
        env:
          TAG: ${{ steps.ver.outputs.tag }}

      - name: Attach to release (or create one)
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.tag }}
          files: release/*
          generate_release_notes: true
          body: |
            ## eClock firmware ${{ steps.ver.outputs.tag }}

            Build of the device-side firmware for the XIAO BLE nRF52840 + EN05 ePaper clock
            (version shown at the bottom left of the syncing screen).

            - **`eClock-<tag>.uf2`** — drag-and-drop onto the `XIAO-BOOT` mass-storage drive
              to flash. **The bootloader auto-reboots into the app ~1 s after the copy
              completes** (the filename does not matter as long as it is not `CURRENT.UF2`).
            - **`eClock-<tag>.hex`** — flash via serial DFU (the reliable path).
            - **`eClock-<tag>.elf`** — unstripped binary, for debugging.

            ### Flash it
            **UF2 (easiest):**
            1. Put the board in the bootloader (double-tap RESET, or
               `python tools/reset_to_bootloader.py`).
            2. Copy this `.uf2` onto the `XIAO-BOOT` drive (any name except
               `CURRENT.UF2`). You can drag it in Explorer, or run the verified
               helper:
               ```
               python firmware/tools/uf2_flash.py eClock-<tag>.uf2
               ```
            3. The bootloader flashes it and **auto-reboots into the app ~1 s
               later** — nothing else needed. (Verified on device 2026-08-28.)

            **Serial DFU (reliable):**
            1. Put the board into its bootloader (double-tap RESET, or run
               `python tools/reset_to_bootloader.py`).
            2. Upload with PlatformIO using the bootloader port:
               ```
               pio run -e mbed -t upload --upload-port <bootloader-port>
               ```
            3. See `docs/SETUP.md` for the full build / flash / monitor flow.
