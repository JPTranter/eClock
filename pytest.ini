[pytest]
; Unit tests for the Home Assistant integration's PURE logic. These live OUTSIDE
; the custom_components package tree (which imports bleak) so pytest never tries
; to import the component __init__.py. conftest.py adds the component dir to
; sys.path so "import message_selection" resolves.
testpaths =
    integrations/homeassistant/tests
python_files = test_*.py
addopts = -p no:cacheprovider
